spring.application.name=kafka-final
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Основной кластер Kafka (TLS + ACL): внешние порты брокеров на хосте.
# Пути к сертификатам относительные, поэтому приложение запускается из корня проекта
platform.kafka.bootstrap-servers=localhost:9093,localhost:9094,localhost:9095
platform.kafka.certs-dir=certs
platform.kafka.password=your-password
# Второй кластер Kafka (без TLS): копия данных от Mirror Maker 2 и рекомендации аналитики
platform.backup-kafka.bootstrap-servers=localhost:19092
# SHOP API: файл с товарами магазинов
platform.shop.products-file=data/products.json
# Служебный каталог Kafka Streams
platform.streams.state-dir=build/kafka-streams

# PostgreSQL: каталог товаров для поиска и журнал запросов клиентов. Таблицы создаёт schema.sql при старте
spring.datasource.url=jdbc:postgresql://localhost:15432/marketplace
spring.datasource.username=marketplace
spring.datasource.password=marketplace
spring.sql.init.mode=always

# В консоли — только сообщения платформы, предупреждения и ошибки
logging.level.root=WARN
logging.level.com.dmitrykoryanov=INFO
# Безвредное предупреждение глобального консьюмера Kafka Streams при загрузке списка запрещённых товаров
logging.level.org.apache.kafka.clients.consumer.internals.OffsetFetcherUtils=ERROR
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
# Логи пишутся в той же кодировке, что и вывод команд (System.out), то есть в кодировке консоли
logging.charset.console=${stdout.encoding:${sun.stdout.encoding:UTF-8}}

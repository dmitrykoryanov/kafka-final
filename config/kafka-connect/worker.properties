# Kafka Connect в standalone-режиме: один процесс, коннектор описан в файле, служебные топики не нужны.
# Подключение к основному кластеру по TLS от имени User:connect
bootstrap.servers=kafka1:9092,kafka2:9092,kafka3:9092
security.protocol=SSL
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/connect/connect.p12
ssl.keystore.password=your-password
ssl.key.password=your-password
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=your-password

# Sink-коннектор читает топик своим консьюмером, ему нужны те же настройки с префиксом consumer.
consumer.security.protocol=SSL
consumer.ssl.keystore.type=PKCS12
consumer.ssl.keystore.location=/etc/kafka/secrets/connect/connect.p12
consumer.ssl.keystore.password=your-password
consumer.ssl.key.password=your-password
consumer.ssl.truststore.type=PKCS12
consumer.ssl.truststore.location=/etc/kafka/secrets/truststore.p12
consumer.ssl.truststore.password=your-password
consumer.auto.offset.reset=earliest

# Сообщения — JSON-строки, в файл они пишутся как есть, одна строка на товар
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=5000

# Здесь лежит FileStreamSinkConnector (connect-file-*.jar)
plugin.path=/usr/share/filestream-connectors

# REST API: статус коннектора — http://localhost:8083/connectors/products-file-sink/status
listeners=http://0.0.0.0:8083

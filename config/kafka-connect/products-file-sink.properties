# Хранилище для отладки: отфильтрованные товары из топика products дописываются в файл,
# одна строка JSON на сообщение. Файл /data/products.jsonl смонтирован в storage/products.jsonl проекта.
# Группа консьюмеров коннектора — connect-products-file-sink (для неё выдан ACL)
name=products-file-sink
connector.class=org.apache.kafka.connect.file.FileStreamSinkConnector
tasks.max=1
topics=products
file=/data/products.jsonl

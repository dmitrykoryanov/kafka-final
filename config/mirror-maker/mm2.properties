# Mirror Maker 2 (выделенный режим, connect-mirror-maker): дублирование данных основного кластера во второй

# Псевдонимы кластеров. Скопированный топик во втором кластере получает префикс источника:
# products -> primary.products
clusters = primary, secondary

# Основной кластер: TLS, Mirror Maker подключается со своим сертификатом (User:mirror-maker)
primary.bootstrap.servers = kafka1:9092,kafka2:9092,kafka3:9092
primary.security.protocol = SSL
primary.ssl.keystore.type = PKCS12
primary.ssl.keystore.location = /etc/kafka/secrets/mirror-maker/mirror-maker.p12
primary.ssl.keystore.password = your-password
primary.ssl.key.password = your-password
primary.ssl.truststore.type = PKCS12
primary.ssl.truststore.location = /etc/kafka/secrets/truststore.p12
primary.ssl.truststore.password = your-password

# Второй кластер: без TLS
secondary.bootstrap.servers = kafka-b:9092

# Направление копирования: только primary -> secondary. Отфильтрованные товары и запросы клиентов
primary->secondary.enabled = true
primary->secondary.topics = products, client-requests
# Обратное направление выключено полностью, иначе Mirror Maker поднимет обработчик для heartbeat-сообщений
# в основной кластер и попытается создать там свои служебные топики
secondary->primary.enabled = false
secondary->primary.emit.heartbeats.enabled = false

# Во втором кластере один брокер, поэтому у всех топиков одна реплика
replication.factor = 1
offset-syncs.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
checkpoints.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

# Mirror Maker только читает основной кластер (ACL: Read, Describe и DescribeConfigs на два топика):
# служебный топик синхронизации смещений храним во втором кластере, ACL и настройки топиков не копируем
# (настройки исходного топика читаются только при создании копии), смещения групп консьюмеров не переносим
offset-syncs.topic.location = target
sync.topic.acls.enabled = false
sync.topic.configs.enabled = false
emit.checkpoints.enabled = false
sync.group.offsets.enabled = false

# Как часто проверять список топиков источника (по умолчанию 10 минут)
refresh.topics.interval.seconds = 10
